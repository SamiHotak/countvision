[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "countvision-edge"
version = "0.6.0"
description = "CountVision edge agent: turns camera streams into visitor and traffic numbers. No video leaves the device."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "supervision>=0.26",
    "trackers>=2.6,<3",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "psutil>=5.9",
    # local web app (countvision-edge app). All permissive licences (MIT / BSD / Apache-2.0).
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "ruamel.yaml>=0.18",
    # time zone database for schedules (Linux/macOS have one built in; Windows does not). Apache-2.0
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Detector runtimes. Install only what you use.
yolo = ["ultralytics>=8.3"]          # AGPL-3.0 code and weights
rfdetr = ["rfdetr"]                  # Apache-2.0 code and weights (PyTorch)
onnx = ["onnxruntime>=1.18"]         # run exported .onnx models on CPU (or CUDA with onnxruntime-gpu)
openvino = ["openvino>=2024.0"]      # run exported models on Intel CPU / iGPU
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "httpx>=0.27",            # FastAPI TestClient
]
e2e = [
    "pytest-playwright>=0.5", # browser tests of the web app (then: python -m playwright install chromium)
]

[project.scripts]
countvision-edge = "countvision_edge.cli:main"

[tool.setuptools.packages.find]
include = ["countvision_edge*"]

[tool.setuptools.package-data]
"countvision_edge.app" = ["static/*"]
"countvision_edge.pilot" = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]
markers = ["e2e: browser tests with Playwright (need: pip install -e \"edge[e2e]\" and a browser)"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
