name: CI

on:
  push:
  pull_request:

jobs:
  edge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: edge/pyproject.toml
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install (CPU only, no GPU, no model downloads)
        run: pip install -e "edge[dev]"
      - name: Lint
        run: ruff check edge
      - name: Tests (synthetic video, fake detector, web API)
        run: python -m pytest edge/tests -q --ignore=edge/tests/e2e

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: edge/pyproject.toml
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install app and Playwright
        run: |
          pip install -e "edge[dev,e2e]"
          python -m playwright install --with-deps chromium
      - name: Browser tests (draw a line, save, download CSV, phone layout)
        run: python -m pytest edge/tests/e2e -q

  docker:
    # Builds the CPU image and runs it against two fake RTSP cameras (MediaMTX looping the
    # evaluation videos): checks install, model download, multi-camera counting and health.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the CPU image
        run: docker build -f docker/Dockerfile -t countvision-edge:cpu .
      - name: Self-test inside the image
        run: docker run --rm countvision-edge:cpu demo --no-video --out /tmp/demo
      - name: Test videos for the fake cameras
        run: |
          mkdir -p eval/videos
          for v in people-detection one-by-one-person-detection; do
            curl -fsSL -o eval/videos/$v.mp4 https://raw.githubusercontent.com/intel-iot-devkit/sample-videos/master/$v.mp4
          done
      - name: Two RTSP cameras + counting service
        working-directory: docker
        run: |
          cp .env.example .env
          mkdir -p config data && sudo chown -R 10001 config data
          docker compose --profile test up -d
          for i in $(seq 1 30); do
            sleep 10
            if docker compose exec -T countvision countvision-entrypoint health | tee /tmp/health.txt | grep -q "table: running" \
               && grep -q "room: running" /tmp/health.txt && ! grep -q " 0 frames" /tmp/health.txt; then
              echo "healthy after $((i * 10)) s"; cat /tmp/health.txt; break
            fi
          done
          docker compose exec -T countvision countvision-entrypoint health
      - name: Camera outage and reconnect
        working-directory: docker
        run: |
          docker compose stop test-camera
          sleep 40
          docker compose exec -T countvision countvision-entrypoint health | tee /tmp/down.txt || true
          grep -q "offline" /tmp/down.txt
          docker compose start test-camera
          for i in $(seq 1 12); do
            sleep 5
            docker compose exec -T countvision countvision-entrypoint health > /tmp/up.txt || true
            if grep -q "room: running" /tmp/up.txt && grep -q "table: running" /tmp/up.txt; then
              echo "back after $((i * 5)) s"; cat /tmp/up.txt; exit 0
            fi
          done
          cat /tmp/up.txt; exit 1
      - name: Logs
        if: always()
        working-directory: docker
        run: docker compose --profile test logs --tail 80

  cloud:
    # Cloud API tests against real PostgreSQL (TimescaleDB image) + Redis, then the web app
    # build and the Playwright browser tests (sign up, confirm email, invite, roles, phone).
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_USER: countvision
          POSTGRES_PASSWORD: countvision
          POSTGRES_DB: countvision
          TIMESCALEDB_TELEMETRY: "off"
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U countvision" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: valkey/valkey:8.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/web/package-lock.json
      - name: Install API (+ the edge engine for video analysis, + ffmpeg)
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -e "cloud/api[dev]" -e "edge[onnx]"
      - name: Lint API
        run: ruff check cloud/api
      - name: API tests (Postgres + Redis)
        working-directory: cloud/api
        run: python -m pytest -q
      - name: Install and build web app
        working-directory: cloud/web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Start API and web app for browser tests
        env:
          CV_DATABASE_URL: postgresql+psycopg://countvision:countvision@localhost:5433/countvision
          CV_REDIS_URL: redis://localhost:6379/2
          CV_EMAIL_BACKEND: memory
          CV_EMAIL_DELIVERY: sync
          CV_SIGNUPS_PER_IP_HOUR: "1000"
          CV_TELEGRAM_API_URL: http://127.0.0.1:8001/api/dev/telegram
          CV_VIDEO_RUNNER: thread
          CV_VIDEO_DETECTOR: blobs
          CV_DATA_DIR: /tmp/cvdata
          # billing ON against the FAKE Stripe inside the API (never the real Stripe in CI)
          CV_STRIPE_SECRET_KEY: sk_test_fake
          CV_STRIPE_WEBHOOK_SECRET: whsec_fake
          CV_STRIPE_API_URL: http://127.0.0.1:8001/api/dev/stripe
        run: |
          countvision-edge demo --out /tmp/demo --no-video
          countvision-cloud migrate
          nohup countvision-cloud serve --port 8001 > /tmp/api.log 2>&1 &
          (cd cloud/web && nohup npm start > /tmp/web.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs localhost:3000/api/health && break; sleep 2; done
      - name: Browser tests (Playwright)
        working-directory: cloud/web
        run: |
          npx playwright install --with-deps chromium
          CV_E2E_VIDEO=/tmp/demo/demo_scene.avi npx playwright test
      - name: Logs and report
        if: failure()
        run: |
          echo "--- slow or failed API requests ---"
          grep -E "\-> 5[0-9][0-9]|\([0-9]{4,} ms\)|Traceback|Error" /tmp/api.log | tail -n 40 || true
          tail -n 80 /tmp/api.log /tmp/web.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: cloud/web/playwright-report
          retention-days: 7

  local:
    # CountVision Local (CV_EDITION=local): API tests of the local edition (plain PostgreSQL 16, NO
    # Redis/Celery), then the REAL desktop launcher (countvision-desktop --no-window) starts its own
    # PostgreSQL, the API, the web app and the edge agent, and a browser test goes through a fresh
    # installation: setup wizard -> camera (MJPEG test stream) -> live picture -> line -> live count ->
    # privacy setting -> licence key -> backup + restore.
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: countvision
          POSTGRES_PASSWORD: countvision
          POSTGRES_DB: countvision
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U countvision" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CV_PG_BIN_DIR: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/web/package-lock.json
      - name: Install API + edge engine + desktop launcher, PostgreSQL 16 (server binaries for the launcher), ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg postgresql-16 postgresql-client-16
          pip install -e "cloud/api[dev]" -e "edge[onnx]" -e "desktop[dev]"
      - name: Lint local + desktop code
        run: ruff check cloud/api desktop
      - name: API tests of the local edition (no Redis running)
        working-directory: cloud/api
        run: python -m pytest -q tests_local
      - name: Desktop launcher tests
        working-directory: desktop
        run: python -m pytest -q
      - name: Build web app
        working-directory: cloud/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Start a fresh CountVision Local with the desktop launcher (+ test camera)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from countvision_cloud.local import licence
          key = licence.new_private_key()
          Path("/tmp/ci_licence_private.pem").write_bytes(licence.private_key_pem(key))
          home = Path("/tmp/cvdesk"); home.mkdir()
          # test settings for the API: development (accepts the CI licence key), the demo detector
          (home / "desktop.json").write_text(json.dumps({"api_env": {
              "CV_ENVIRONMENT": "development", "CV_VIDEO_DETECTOR": "blobs",
              "CV_LICENCE_PUBLIC_KEY": licence.public_text_of(key)}}))
          PY
          countvision-cloud licence-create --key /tmp/ci_licence_private.pem --customer "Café Sonne GmbH" \
            --cameras 4 --valid-until 2030-12-31 --out /tmp/ci_licence.txt > /dev/null
          countvision-edge demo --out /tmp/demo --no-video
          nohup python cloud/web/e2e-local/mjpeg_server.py /tmp/demo/demo_scene.avi 8090 > /tmp/mjpeg.log 2>&1 &
          touch /tmp/cvdesk-model.onnx  # the demo detector needs no model; the launcher wants the file
          countvision-desktop --home /tmp/cvdesk --model /tmp/cvdesk-model.onnx --check
          nohup countvision-desktop --home /tmp/cvdesk --model /tmp/cvdesk-model.onnx --no-window \
            > /tmp/desktop.log 2>&1 &
          for i in $(seq 1 60); do grep -q "CountVision is running" /tmp/desktop.log && break; sleep 2; done
          cat /tmp/desktop.log
          curl -fs localhost:3000/api/edition
      - name: Browser test (fresh installation to backup and restore)
        working-directory: cloud/web
        run: |
          npx playwright install --with-deps chromium
          CV_E2E_LICENCE=$(cat /tmp/ci_licence.txt) CV_E2E_MJPEG=http://127.0.0.1:8090/video \
            npx playwright test -c playwright.local.config.ts
      - name: Clean stop (countvision-desktop --quit)
        run: |
          countvision-desktop --home /tmp/cvdesk --quit
          sleep 5
          grep -q "CountVision stopped" /tmp/cvdesk/logs/launcher.log
          grep -q "Stop requested" /tmp/cvdesk/logs/edge.log
          if pgrep -f "countvision_cloud.cli serve" || pgrep -f "cvdesk/db"; then echo "still running"; exit 1; fi
      - name: Logs
        if: failure()
        run: tail -n 80 /tmp/desktop.log /tmp/cvdesk/logs/*.log /tmp/mjpeg.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-local
          path: cloud/web/playwright-report
          retention-days: 7

  desktop-windows:
    # The desktop launcher and the live camera picture on Windows (paths, windowless child processes,
    # stop files). The installed program is tested by the windows-installer job.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: edge/pyproject.toml
      - name: Install edge engine + desktop launcher
        run: pip install -e "edge[dev]" -e "desktop[dev]"
      - name: Desktop launcher tests
        working-directory: desktop
        run: python -m pytest -q
      - name: Live picture tests
        working-directory: edge
        run: python -m pytest -q tests/test_live_view.py

  windows-installer:
    # CountVision Local for shops: builds CountVision-Local-Setup-<version>.exe (embeddable Python 3.12,
    # PostgreSQL 16, Node.js, the app, YOLOX-Tiny, CountVision.exe, Inno Setup), installs it silently
    # like a customer, runs the smoke test against the installed program (setup wizard, login, camera
    # counting with the bundled model, live picture, video analysis, PDF, backup), stops it, installs it
    # again over the running program (update: stopped cleanly, backup before the database update, data
    # kept), and uninstalls it (data kept). The setup.exe is a downloadable artifact of this run.
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    env:
      APP: C:\Program Files\CountVision
      CVDATA: C:\ProgramData\CountVision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/web/package-lock.json
      - name: Cache downloads (Python, PostgreSQL, Microsoft runtimes)
        uses: actions/cache@v4
        with:
          path: build/windows/downloads
          key: win-downloads-${{ hashFiles('packaging/windows/build.ps1') }}
      - name: Build the setup
        run: .\packaging\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CountVision-Local-Setup
          path: dist/CountVision-Local-Setup-*
          retention-days: 14
          compression-level: 0
      - name: Install silently (like a customer, with desktop icon and autostart)
        run: |
          $setup = (Get-ChildItem dist\CountVision-Local-Setup-*.exe | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$env:RUNNER_TEMP\install1.log", "/TASKS=desktopicon,autostart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install1.log" -Tail 80; throw "setup exit code $($p.ExitCode)" }
          foreach ($f in @("$env:APP\CountVision.exe", "$env:APP\python\pythonw.exe", "$env:APP\node\node.exe", "$env:APP\pgsql\bin\pg_ctl.exe", "$env:APP\web\server.js", "$env:APP\models\yolox_tiny.onnx", "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\CountVision.lnk", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\CountVision.lnk")) {
            if (-not (Test-Path -LiteralPath $f)) { throw "missing after install: $f" }
          }
          netsh advfirewall firewall show rule name="CountVision app (shop network)"
          if ($LASTEXITCODE -ne 0) { throw "firewall rule missing" }
          $acl = (icacls $env:CVDATA) -join "`n"
          Write-Output $acl
          if ($acl -match "BUILTIN\\Users|Authenticated Users|Everyone") { throw "the data folder is readable by other Windows users" }
          Get-Content "$env:APP\version.txt"
      - name: Demo count + test camera (with the installed Python)
        run: |
          & "$env:APP\python\python.exe" -m countvision_edge demo --out C:\cvsmoke --no-video
          if ($LASTEXITCODE -ne 0) { throw "demo count failed" }
          # the test camera runs with the CI machine's Python: the update below replaces the program folder
          python -m pip install --disable-pip-version-check -q opencv-python-headless
          Start-Process python -ArgumentList "cloud\web\e2e-local\mjpeg_server.py", "C:\cvsmoke\demo_scene.avi", "8090" -WindowStyle Hidden
          & "$env:APP\python\python.exe" -c "import webview, clr, pystray; print('window parts load')"
          if ($LASTEXITCODE -ne 0) { throw "window parts do not load" }
          & "$env:APP\python\python.exe" -m countvision_desktop --check
          if ($LASTEXITCODE -ne 0) { throw "--check failed" }
      - name: Start CountVision.exe (no window on the CI machine) + smoke test of a fresh installation
        run: |
          Start-Process "$env:APP\CountVision.exe" -ArgumentList "--no-window"
          python packaging\windows\smoke_test.py fresh --state "$env:RUNNER_TEMP\smoke.json" --video C:\cvsmoke\demo_scene.avi
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }
      - name: Clean stop (CountVision.exe --quit)
        run: |
          $p = Start-Process "$env:APP\CountVision.exe" -ArgumentList "--quit" -Wait -PassThru
          Start-Sleep -Seconds 3
          $left = Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "$env:APP\*" }
          if ($left) { $left | Format-Table ProcessId, Name, CommandLine -AutoSize | Out-String -Width 300; throw "still running after --quit" }
          if (-not (Select-String -Path "$env:CVDATA\logs\launcher.log" -Pattern "CountVision stopped" -Quiet)) { throw "no clean stop in launcher.log" }
          if (-not (Select-String -Path "$env:CVDATA\logs\edge.log" -Pattern "Stop requested" -Quiet)) { throw "the counting service was not stopped cleanly" }
      - name: Update - install again over the RUNNING program, then start it
        run: |
          Start-Process "$env:APP\CountVision.exe" -ArgumentList "--no-window"
          python packaging\windows\smoke_test.py wait
          $setup = (Get-ChildItem dist\CountVision-Local-Setup-*.exe | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$env:RUNNER_TEMP\install2.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install2.log" -Tail 80; throw "update setup exit code $($p.ExitCode)" }
          # pretend the installed version was older, so this start is an update (backup first)
          python -c "import json, pathlib; p = pathlib.Path(r'$env:CVDATA\desktop.json'); d = json.loads(p.read_text()); d['app_version'] = '0.0.0'; p.write_text(json.dumps(d))"
          Start-Process "$env:APP\CountVision.exe" -ArgumentList "--no-window"
          python packaging\windows\smoke_test.py after-update --state "$env:RUNNER_TEMP\smoke.json"
          if ($LASTEXITCODE -ne 0) { throw "smoke test after the update failed" }
      - name: Uninstall silently (keeps the data)
        run: |
          Start-Process "$env:APP\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $deadline = (Get-Date).AddMinutes(4)
          while ((Test-Path -LiteralPath "$env:APP") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          if (Test-Path -LiteralPath "$env:APP") { Get-ChildItem -Recurse "$env:APP" | Select-Object -First 20; throw "program folder still there" }
          if (-not (Test-Path -LiteralPath "$env:CVDATA\db\PG_VERSION")) { throw "the data was deleted (it must be kept)" }
          if (Test-Path -LiteralPath "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\CountVision.lnk") { throw "autostart still there" }
          netsh advfirewall firewall show rule name="CountVision app (shop network)" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "firewall rule still there" }
          Write-Output "uninstalled, data kept"
          exit 0  # netsh's "rule not found" (exit 1) above is the expected answer
      - name: Logs
        if: failure()
        run: |
          Get-ChildItem "$env:CVDATA\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "===== $($_.Name)"; Get-Content $_.FullName -Tail 80 }
          Get-ChildItem "$env:RUNNER_TEMP\install*.log" -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "===== $($_.Name)"; Get-Content $_.FullName -Tail 60 }

  cloud-docker:
    # The full local stack (cloud/compose.yaml): builds images, starts everything, signs up
    # through the web app and checks that the confirmation email reached Mailpit via Celery.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        working-directory: cloud
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 300
          docker compose ps
      - name: Smoke test (web -> api -> db, worker -> Mailpit)
        run: |
          curl -fs localhost:3000/api/health
          curl -fs -X POST localhost:3000/api/auth/signup -H "X-CountVision: 1" -H "Content-Type: application/json" \
            -d '{"email":"ci@example.com","name":"CI","password":"a-long-ci-password"}' -c /tmp/cookies
          curl -fs -b /tmp/cookies -X POST localhost:3000/api/orgs -H "X-CountVision: 1" \
            -H "Content-Type: application/json" -d '{"name":"CI Shop"}'
          for i in $(seq 1 20); do
            curl -fs "localhost:8025/api/v1/search?query=to:ci@example.com" | tee /tmp/mail.json | grep -q "Confirm your email" && break
            sleep 2
          done
          grep -q "Confirm your email" /tmp/mail.json
          docker compose -f cloud/compose.yaml exec -T db psql -U countvision -tAc \
            "SELECT extversion FROM pg_extension WHERE extname = 'timescaledb'" | grep -E "^[0-9]"
      - name: Device pairing and upload (hypertables in real TimescaleDB)
        run: |
          docker compose -f cloud/compose.yaml exec -T api countvision-edge demo --out /tmp/demo --no-video > /dev/null
          docker compose -f cloud/compose.yaml cp api:/tmp/demo/demo_scene.avi /tmp/demo_scene.avi
          python3 - <<'PY'
          import json, time, urllib.request
          base = "http://localhost:3000"
          def call(method, path, body=None, headers=None, cookie=None):
              h = {"Content-Type": "application/json", "X-CountVision": "1", **(headers or {})}
              if cookie: h["Cookie"] = cookie
              req = urllib.request.Request(base + path, data=json.dumps(body).encode() if body is not None else None,
                                           method=method, headers=h)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read()), r.headers.get("Set-Cookie")
          _, cookie = call("POST", "/api/auth/login", {"email": "ci@example.com", "password": "a-long-ci-password"})
          cookie = cookie.split(";")[0]
          org = call("GET", "/api/orgs", cookie=cookie)[0][0]
          site = call("POST", f"/api/orgs/{org['id']}/sites", {"name": "CI Site"}, cookie=cookie)[0]
          code = call("POST", f"/api/orgs/{org['id']}/pairing-codes", {"site_id": site["id"], "device_name": "CI PC"}, cookie=cookie)[0]
          dev = call("POST", "/api/device/pair", {"code": code["code"], "edge_device_id": "edge-ci"})[0]
          now = int(time.time()); minute = now - now % 60 - 60
          auth = {"Authorization": "Bearer " + dev["token"]}
          batch = {"batch_id": "ci-1", "cameras": [{"id": "door", "state": "running", "connected": True}],
                   "line_counts": [{"camera_id": "door", "window_start": minute, "line": "entrance", "class_name": "*", "in_count": 5, "out_count": 2}],
                   "events": [{"event_id": "e1", "camera_id": "door", "kind": "line_cross", "ts": minute + 5, "name": "entrance", "direction": "in"}]}
          print(call("POST", "/api/device/ingest", batch, headers=auth)[0])
          print(call("POST", "/api/device/ingest", batch, headers=auth)[0])  # repeat: no doubles
          detail = call("GET", f"/api/orgs/{org['id']}/devices/{dev['device_id']}", cookie=cookie)[0]
          # "today" counts line crossings (events), so the repeated batch still gives IN 1
          assert detail["online"] and detail["cameras"][0]["today"]["entrance"] == {"in": 1, "out": 0}, detail
          print("device online, today IN 1 / OUT 0")
          # Phase 3 C: a line saved in the cloud reaches the device's long-poll
          cam = detail["cameras"][0]["id"]
          doc = {"lines": [{"name": "door", "p1": [0.1, 0.5], "p2": [0.9, 0.5]}], "zones": [], "classes": ["person"]}
          saved = call("PUT", f"/api/orgs/{org['id']}/cameras/{cam}/config", doc, cookie=cookie)[0]
          assert saved["desired_version"] == 1, saved
          poll = call("GET", "/api/device/poll?rev=-1&wait=0", headers=auth)[0]
          assert poll["changed"] and poll["cameras"][0]["version"] == 1, poll
          print("config v1 delivered to the device")
          # live stream through the web container (SSE): the first message is "hello"
          req = urllib.request.Request(f"{base}/api/orgs/{org['id']}/live?max_s=2", headers={"Cookie": cookie})
          with urllib.request.urlopen(req, timeout=10) as r:
              assert r.headers["Content-Type"].startswith("text/event-stream")
              assert b'"hello"' in r.read(), "no hello on the live stream"
          print("live stream ok")
          # Phase 4 A: dashboard numbers, PDF (fonts in the image), report email with PDF via Celery -> Mailpit
          dash = call("GET", f"/api/orgs/{org['id']}/sites/{site['id']}/dashboard", cookie=cookie)[0]
          entrance = next(ln for ln in dash["lines"] if ln["line"] == "entrance")  # "door" (saved above) sorts first
          assert dash["totals"]["in"] == 1 and entrance["in"] == 1, (dash["totals"], dash["lines"])
          req = urllib.request.Request(f"{base}/api/orgs/{org['id']}/sites/{site['id']}/report.pdf", headers={"Cookie": cookie})
          with urllib.request.urlopen(req) as r:
              assert r.read(4) == b"%PDF"
          import re
          found = json.loads(urllib.request.urlopen("http://localhost:8025/api/v1/search?query=to:ci@example.com").read())
          msg = json.loads(urllib.request.urlopen(f"http://localhost:8025/api/v1/message/{found['messages'][0]['ID']}").read())
          token = re.search(r"verify-email\?token=([A-Za-z0-9_\-]+)", msg["Text"]).group(1)
          call("POST", "/api/auth/verify-email", {"token": token}, cookie=cookie)
          me = call("GET", f"/api/orgs/{org['id']}/members", cookie=cookie)[0][0]
          sched = call("POST", f"/api/orgs/{org['id']}/report-schedules",
                       {"site_id": site["id"], "frequency": "daily", "recipients": [me["user_id"]], "attach_csv": True}, cookie=cookie)[0]
          print(call("POST", f"/api/orgs/{org['id']}/report-schedules/{sched['id']}/send", {}, cookie=cookie)[0])
          for _ in range(30):
              res = json.loads(urllib.request.urlopen("http://localhost:8025/api/v1/search?query=subject:%22daily%20report%22").read())
              if res["messages"]:
                  break
              time.sleep(2)
          assert res["messages"] and res["messages"][0]["Attachments"] == 2, res
          print("report email with PDF + CSV reached Mailpit")
          # Phase 4 B: API key + public API, and a real video job in the video-worker container
          key = call("POST", f"/api/orgs/{org['id']}/api-keys", {"name": "CI"}, cookie=cookie)[0]["key"]
          req = urllib.request.Request(f"{base}/api/v1/sites", headers={"Authorization": "Bearer " + key})
          with urllib.request.urlopen(req) as r:
              assert json.loads(r.read())[0]["name"] == "CI Site"
          print("public API ok")
          video = open("/tmp/demo_scene.avi", "rb").read()
          jobs = f"/api/orgs/{org['id']}/video-jobs"
          job = call("POST", jobs, {"name": "demo.avi", "size_bytes": len(video)}, cookie=cookie)[0]
          req = urllib.request.Request(f"{base}{jobs}/{job['id']}/upload?offset=0", data=video, method="PUT",
                                       headers={"Cookie": cookie, "X-CountVision": "1", "Content-Type": "application/octet-stream"})
          urllib.request.urlopen(req).read()
          call("POST", f"{jobs}/{job['id']}/complete", {}, cookie=cookie)
          for _ in range(60):
              job = call("GET", f"{jobs}/{job['id']}", cookie=cookie)[0]
              if job["status"] != "probing":
                  break
              time.sleep(1)
          assert job["status"] == "ready", job
          call("PUT", f"{jobs}/{job['id']}/config", {"lines": [{"name": "door", "p1": [0.1, 0.5], "p2": [0.9, 0.5]}],
               "zones": [], "classes": ["person", "car"]}, cookie=cookie)
          call("POST", f"{jobs}/{job['id']}/start", {}, cookie=cookie)
          for _ in range(180):
              job = call("GET", f"{jobs}/{job['id']}", cookie=cookie)[0]
              if job["status"] in ("done", "failed"):
                  break
              time.sleep(1)
          assert job["status"] == "done", job
          assert job["files"]["annotated.mp4"] and job["result"]["video_codec"] == "h264", job["result"]
          print("video job done in the video worker (YOLOX-Tiny, H.264):", job["result"]["totals"])
          PY
          docker compose -f cloud/compose.yaml exec -T db psql -U countvision -tAc \
            "SELECT hypertable_name FROM timescaledb_information.hypertables ORDER BY 1" | tee /tmp/ht.txt
          grep -q line_counts /tmp/ht.txt
      - name: Logs
        if: always()
        working-directory: cloud
        run: docker compose logs --tail 60
