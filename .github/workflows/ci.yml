name: CI

on:
  push:
  pull_request:

jobs:
  edge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: edge/pyproject.toml
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install (CPU only, no GPU, no model downloads)
        run: pip install -e "edge[dev]"
      - name: Lint
        run: ruff check edge
      - name: Tests (synthetic video, fake detector, web API)
        run: python -m pytest edge/tests -q --ignore=edge/tests/e2e

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: edge/pyproject.toml
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install app and Playwright
        run: |
          pip install -e "edge[dev,e2e]"
          python -m playwright install --with-deps chromium
      - name: Browser tests (draw a line, save, download CSV, phone layout)
        run: python -m pytest edge/tests/e2e -q
