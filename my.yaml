# CountVision edge agent - example configuration (webcam, YOLO).
#
#   countvision-edge run --config configs/example.yaml --show
#
# All keys are checked. A typo gives an error message instead of being ignored.
# Secrets (camera passwords) do NOT go into this file. Use ${ENV_VAR}, see example_rtsp_onnx.yaml.

data_dir: data            # the database and heatmaps are stored here
log_level: INFO

detector:
  type: ultralytics       # ultralytics (AGPL-3.0) | rfdetr (Apache-2.0) | onnx | openvino
  model: yolo11n.pt       # downloaded on first start (needs internet once)
  imgsz: 640
  conf: 0.2               # low on purpose: ByteTrack also uses low-score boxes
  device: auto            # auto | cpu | cuda

storage:
  retention_days: 30      # numbers older than this are deleted

cameras:
  - id: door
    name: Entrance
    source:
      uri: 0              # 0 = first USB webcam. Also: a video file, rtsp://..., http://.../video
      width: 1280         # webcam only (optional)
      height: 720
      fourcc: MJPG        # webcam only (optional). MJPG often gives smooth 720p on USB webcams
    classes: [person]     # what to count. Any class name of the model: person, car, bus, truck ...
    coordinates: normalized   # lines and zones use 0..1 of the image (survives resolution changes)
    anchor: bottom_center     # which point of the box is used: the feet. Or: center

    # Counting line from p1 to p2. Stand at p1, look at p2 (as you see it on screen):
    # an object that moves from your LEFT to your RIGHT counts as IN when in_direction is to_right.
    # Draw it so the arrow in the preview points into the shop.
    lines:
      - name: entrance
        p1: [0.15, 0.55]
        p2: [0.85, 0.55]
        in_direction: to_right
        deadband_px: 4

    # Polygon zones: occupancy and dwell time. kind: queue also measures queue length
    # (objects that stay in the zone for 3 s and move slower than 0.25 box heights per second).
    zones:
      - name: counter
        kind: queue
        polygon: [[0.10, 0.60], [0.55, 0.60], [0.55, 0.95], [0.10, 0.95]]

    scheduler:
      target_fps: 10      # live cameras: 10 FPS is enough for people. Leave out for files.
      adaptive: true      # lower the FPS automatically when the computer is too slow

    heatmap:
      enabled: true
